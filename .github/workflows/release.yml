name: PublishDocker

env:
  REGISTRY: ghcr.io
  #IMAGE_NAME: ${{ github.repository }}
  IMAGE_NAME: 'mrks115/hass-dbstats'

on:
  release:
    types: [published]

jobs:
  test:
    name: Test
    uses: ./.github/workflows/test.yml

  release_db_stats_docker:
    name: ReleaseDbStatsDocker
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{major}}.{{minor}}.{{patch}}
            type=semver,pattern={{major}}
            type=raw,value=stable
      - name: Setup Node.JS
        uses: actions/setup-node@v5
        with:
          node-version: 24.11.1
          cache: npm
          cache-dependency-path: |
            shared/package-lock.json
            backend/package-lock.json
            frontend/package-lock.json
      - name: 'change backend version'
        working-directory: ./backend
        run: npm version "${{ github.ref_name }}" --no-git-tag-version --allow-same-version
      - name: 'change frontend version'
        working-directory: ./frontend
        run: npm version "${{ github.ref_name }}" --no-git-tag-version --allow-same-version
      - name: Install shared deps
        working-directory: ./shared
        run: npm ci
      - name: Install backend deps
        working-directory: ./backend
        run: npm ci
      - name: build back
        working-directory: ./backend
        run: npm run build
      - name: clean back
        working-directory: ./backend
        run: npm  ci --omit=dev
      - name: Install frontend deps
        working-directory: ./frontend
        run: npm ci
      - name: build front
        working-directory: ./frontend
        run: npm run build

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
